name: Auto PR vers dev

on:
  push:
    branches-ignore: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Créer la PR vers dev si elle n'existe pas
        run: |
          count=$(gh pr list --head "$GITHUB_REF_NAME" --base dev --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base dev \
              --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --body "PR ouverte automatiquement depuis \`$GITHUB_REF_NAME\`." \
              --assignee "$GITHUB_ACTOR"
          else
            echo "Une PR existe déjà pour $GITHUB_REF_NAME"
          fi