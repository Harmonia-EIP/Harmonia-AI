name: Diagnose AI service (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect running AI service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -x
            cd /home/ubuntu/harmonia
            echo "--- docker-compose.yml (ai service section) ---"
            cat docker-compose.yml
            echo "--- container status ---"
            docker compose ps
            echo "--- host-mounted saved_models (legacy scp target) ---"
            ls -la /home/ubuntu/harmonia/ai-models/saved_models/ 2>&1 || true
            echo "--- saved_models as seen by the container ---"
            docker compose exec -T ai ls -la /app/saved_models 2>&1 || true
            echo "--- health endpoint ---"
            docker compose exec -T ai curl -s localhost:5000/health 2>&1 || true
            echo "--- generate: model-1 (default) ---"
            docker compose exec -T ai curl -s -X POST localhost:5000/generate -H "Content-Type: application/json" -d "{\"prompt\":\"Flute\",\"model_id\":1,\"model_name\":\"model-1\"}" 2>&1 || true
            echo "--- generate: charter_v1 ---"
            docker compose exec -T ai curl -s -X POST localhost:5000/generate -H "Content-Type: application/json" -d "{\"prompt\":\"Flute\",\"model_id\":2,\"model_name\":\"charter_v1\"}" 2>&1 || true
            echo "--- recent container logs ---"
            docker compose logs ai --tail 80
