name: Harmonia CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            HARMONIA/requirements-ci.txt
            HARMONIA/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HARMONIA/requirements-ci.txt
          python -m pip install -r HARMONIA/requirements-dev.txt

      - name: Run tests
        working-directory: HARMONIA
        run: python -m pytest -q

      - name: Run security scan
        working-directory: HARMONIA
        run: python -m bandit -q -r scripts src

      - name: Run compile check
        working-directory: HARMONIA
        run: python -m compileall scripts src tests

