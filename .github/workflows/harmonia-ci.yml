name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-guard:
    name: Branch guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Vers main, seules les PR depuis dev sont autorisées (reçu : $HEAD_REF)."
            exit 1
          fi
          echo "OK : $HEAD_REF -> $BASE_REF"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_PUSH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            HARMONIA/requirements-ci.txt
            HARMONIA/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HARMONIA/requirements-ci.txt
          python -m pip install -r HARMONIA/requirements-dev.txt

      - name: Run tests
        working-directory: HARMONIA
        run: python -m pytest -q

      - name: Run security scan
        working-directory: HARMONIA
        run: python -m bandit -q -r scripts src

      - name: Run compile check
        working-directory: HARMONIA
        run: python -m compileall scripts src tests

      - name: Publish metrics dashboard payload
        if: github.event_name == 'push' && env.METRICS_TOKEN != ''
        working-directory: HARMONIA
        env:
          HARMONIA_METRICS_URL: https://harmonia.mcoet.com/receiver.php
        run: |
          mkdir -p benchmarks/reports
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "source": "github-actions",
              "model_version": f"ci-{os.environ.get('GITHUB_SHA', 'unknown')[:7]}",
              "model_hash": os.environ.get("GITHUB_SHA", "unknown"),
              "metrics": {
                  "ci_tests_passed": 1.0,
                  "ci_security_passed": 1.0,
                  "ci_compile_passed": 1.0,
              },
              "ci": {
                  "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "ref": os.environ.get("GITHUB_REF_NAME", ""),
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              },
          }

          out = Path("benchmarks/reports/ci_push_metrics.json")
          out.write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(f"Wrote {out}")
          PY
          python scripts/push_latest_metrics.py --report benchmarks/reports/ci_push_metrics.json