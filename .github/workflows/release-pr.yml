name: PR dev vers main

on:
  push:
    branches: [dev]

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Créer la PR dev -> main si nécessaire
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "dev et main sont identiques, rien à release"
            exit 0
          fi

          count=$(gh pr list --head dev --base main --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Release : dev → main" \
              --body "PR de release ouverte automatiquement ($ahead commit(s) à livrer). La merger déclenche le déploiement en production."
          else
            echo "Une PR dev -> main est déjà ouverte"
          fi