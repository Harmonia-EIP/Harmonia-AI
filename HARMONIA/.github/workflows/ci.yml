name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HARMONIA/requirements-ci.txt
          python -m pip install -r HARMONIA/requirements-dev.txt

      - name: Run tests
        working-directory: HARMONIA
        run: |
          python -m pytest -q

      - name: Run bandit
        working-directory: HARMONIA
        run: |
          python -m bandit -q -r scripts src

      - name: Run compile check
        working-directory: HARMONIA
        run: |
          python -m compileall scripts src tests


