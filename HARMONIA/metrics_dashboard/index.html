<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonia Metrics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <header>
      <h1 class="text-3xl md:text-4xl font-bold">Harmonia - Metrics Dashboard</h1>
      <p id="sourceLabel" class="text-slate-400 mt-2">Chargement des métriques...</p>
    </header>

    <section id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4"></section>

    <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-6 shadow-lg">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-xl font-semibold">Évolution des modèles</h2>
        <span class="text-sm text-slate-400">Loss et MSE dans le temps</span>
      </div>
      <div class="h-[380px]"><canvas id="historyChart"></canvas></div>
    </section>

    <section class="grid grid-cols-1 xl:grid-cols-2 gap-8">
      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-6 shadow-lg">
        <div class="flex items-center justify-between gap-4 mb-4">
          <h2 class="text-xl font-semibold">Paramètres VST</h2>
          <span class="text-sm text-slate-400">Radar chart</span>
        </div>
        <div class="h-[420px]"><canvas id="radarChart"></canvas></div>
      </article>

      <article class="bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-6 shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Résumé brut</h2>
        <pre id="rawJson" class="text-xs md:text-sm bg-slate-950 border border-slate-800 rounded-lg p-3 overflow-auto max-h-[420px]"></pre>
      </article>
    </section>
  </main>

  <script>
    const fallbackLatest = {
      timestamp: "2026-04-30T12:00:00Z",
      model_version: "model_20260430_1200",
      model_hash: "demo-hash",
      metrics: {
        loss: 0.0284,
        mse: 0.0312,
        mae: 0.1128,
        continuous_mse: 0.0211,
        binary_bce: 0.0073,
        per_param_mse: {
          Cutoff: 0.024,
          Resonance: 0.041,
          Attack: 0.019,
          Decay: 0.028,
          Release: 0.035,
          Volume: 0.021
        }
      },
      loss_history: [0.21, 0.17, 0.14, 0.11, 0.09, 0.07, 0.05, 0.04, 0.03, 0.028]
    };
    const fallbackHistory = [
      { timestamp: "2026-04-24T16:00:00Z", model_version: "model_a", loss: 0.041, mse: 0.049 },
      { timestamp: "2026-04-25T16:00:00Z", model_version: "model_b", loss: 0.035, mse: 0.041 },
      { timestamp: "2026-04-30T12:00:00Z", model_version: "model_c", loss: 0.0284, mse: 0.0312 }
    ];

    const cardsEl = document.getElementById("cards");
    const sourceLabelEl = document.getElementById("sourceLabel");
    const rawJsonEl = document.getElementById("rawJson");
    let historyChart = null;
    let radarChart = null;

    function extractMetrics(payload) {
      if (payload && payload.metrics && typeof payload.metrics === "object") return payload.metrics;
      if (payload && payload.latest_evaluation_report && payload.latest_evaluation_report.metrics) return payload.latest_evaluation_report.metrics;
      if (payload && payload.latest_benchmark && payload.latest_benchmark.eval_metrics) return payload.latest_benchmark.eval_metrics;
      return payload || {};
    }

    function formatNumber(value) {
      if (typeof value !== "number" || Number.isNaN(value)) return "n/a";
      return Math.abs(value) >= 1 ? value.toFixed(3) : value.toFixed(4);
    }

    function flattenNumbers(obj, prefix = "") {
      if (!obj || typeof obj !== "object") return [];
      const items = [];
      for (const [key, value] of Object.entries(obj)) {
        const fullKey = prefix ? `${prefix}.${key}` : key;
        if (typeof value === "number" && Number.isFinite(value)) {
          items.push([fullKey, value]);
        } else if (value && typeof value === "object" && !Array.isArray(value)) {
          items.push(...flattenNumbers(value, fullKey));
        }
      }
      return items;
    }

    function renderCards(metrics) {
      cardsEl.innerHTML = "";
      const items = [
        ["Loss", metrics.loss ?? metrics.final_loss],
        ["MSE", metrics.mse],
        ["MAE", metrics.mae],
        ["Continuous MSE", metrics.continuous_mse],
        ["Binary BCE", metrics.binary_bce],
        ["Samples", metrics.sample_count]
      ];

      for (const [label, value] of items) {
        const card = document.createElement("article");
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg";
        card.innerHTML = `
          <p class="text-slate-400 text-sm">${label}</p>
          <p class="text-2xl font-bold mt-1">${formatNumber(value)}</p>
        `;
        cardsEl.appendChild(card);
      }
    }

    function renderHistoryChart(history) {
      const ctx = document.getElementById("historyChart");
      if (historyChart) historyChart.destroy();
      const labels = history.map((row) => row.model_version || (row.timestamp || "").slice(0, 10));
      const lossSeries = history.map((row) => Number(row.loss ?? row.final_loss ?? row?.metrics?.loss ?? row?.metrics?.final_loss ?? NaN));
      const mseSeries = history.map((row) => Number(row.mse ?? row?.metrics?.mse ?? NaN));
      historyChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Loss globale",
              data: lossSeries,
              borderColor: "#60a5fa",
              backgroundColor: "rgba(96,165,250,0.12)",
              tension: 0.3,
              fill: false,
            },
            {
              label: "MSE globale",
              data: mseSeries,
              borderColor: "#a78bfa",
              backgroundColor: "rgba(167,139,250,0.12)",
              tension: 0.3,
              fill: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#e2e8f0" } } },
          scales: {
            x: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.12)" } },
            y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.12)" } },
          },
        },
      });
    }

    function renderRadarChart(metrics) {
      const perParam = metrics.per_param_mse && typeof metrics.per_param_mse === "object" ? metrics.per_param_mse : null;
      const ctx = document.getElementById("radarChart");
      if (radarChart) radarChart.destroy();
      if (!perParam || !Object.keys(perParam).length) {
        ctx.parentElement.innerHTML = '<p class="text-slate-400">Aucune métrique par paramètre disponible.</p>';
        return;
      }

      const labels = Object.keys(perParam);
      const values = labels.map((key) => Number(perParam[key] ?? 0));
      radarChart = new Chart(ctx, {
        type: "radar",
        data: {
          labels,
          datasets: [
            {
              label: "MSE par paramètre",
              data: values,
              backgroundColor: "rgba(34,197,94,0.18)",
              borderColor: "#22c55e",
              pointBackgroundColor: "#22c55e",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#e2e8f0" } } },
          scales: {
            r: {
              angleLines: { color: "rgba(148,163,184,0.2)" },
              grid: { color: "rgba(148,163,184,0.15)" },
              pointLabels: { color: "#e2e8f0" },
              ticks: { color: "#94a3b8" },
            },
          },
        },
      });
    }

    async function loadMetrics() {
      let latest = fallbackLatest;
      let history = fallbackHistory;
      let source = "Données simulées";

      try {
        const res = await fetch(`latest_metrics.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        latest = await res.json();
        source = "latest_metrics.json";
      } catch (_) {}

      try {
        const res = await fetch(`history_metrics.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        history = await res.json();
      } catch (_) {}

      const metrics = extractMetrics(latest);
      sourceLabelEl.textContent = `Source: ${source}`;
      renderCards(metrics);
      renderHistoryChart(Array.isArray(history) ? history : []);
      renderRadarChart(metrics);
      rawJsonEl.textContent = JSON.stringify(latest, null, 2);
    }

    loadMetrics();
  </script>
</body>
</html>
